name: PointSixPoolMonitor
options:
  bundleIdPrefix: com.pointsixpool
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PointSixPool Monitor
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: Verify your PointSixPool account with your device passkey.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PointSixPoolMonitor:
    type: application
    platform: iOS
    sources: [PointSixPoolMonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pointsixpool.monitor
        TARGETED_DEVICE_FAMILY: "1,2"
