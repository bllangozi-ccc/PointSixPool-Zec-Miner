name: Native monitor candidate checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'Apps/PointSixPoolMonitor/**'
      - '.github/workflows/native-monitor-candidate.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: Apps/PointSixPoolMonitor/android
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-android-debug-test-only
          path: Apps/PointSixPoolMonitor/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: Apps/PointSixPoolMonitor/ios
      - run: xcodebuild -project PointSixPoolMonitor.xcodeproj -scheme PointSixPoolMonitor -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: Apps/PointSixPoolMonitor/ios
